stages:
  - test
  - build

image: marvinvanaalst/poetry-ci:0.3

prior:
  allow_failure: true
  stage: test
  script:
    - poetry install
    - poetry run ruff check src/ tests/
  except:
    - merge_requests
    - main

test:
  stage: test
  script:
    - poetry install
    - poetry run pytest --disable-warnings --cov
  coverage: "/TOTAL.+ ([0-9]{1,3}%)/"
  only:
    - merge_requests
    - main # if i push directly and for coverage badge

# Enable this once you are ready to publish
