about:
  description: ${{ description }}
  documentation: ${{ source_url }}
  homepage: ${{ source_url }}
  license: MIT
  repository: ${{ source_url }}
  summary: ${{ description }}
build:
  noarch: python
  number: 0
  script:
  - python -m pip install . -vv --no-deps --no-build-isolation
context:
  description: Parameterisation of ODE models using the brenda database and AI tools
  name: parameteriser
  source_url: https://gitlab.com/marvin.vanaalst/parameteriser.git
  version: 0.1.0
package:
  name: parameteriser
  version: ${{ version }}
requirements:
  host:
  - pip
  - python 3.11
  run:
  - beautifulsoup4 >=4.12.3
  - biopython >=1.83,<2
  - blast >=2.15.0
  - jupyter =*
  - jupyter_contrib_nbextensions >=0.7.0
  - matplotlib >=3.8.4
  - more-itertools >=10.2.0,<10.3
  - notebook >=6.5.4
  - numpy >=1.26.4
  - pandas >=2.2.2
  - pandas-stubs >=2.0.1.230501
  - pip >=24.0,<25
  - pre-commit >=3.7.0
  - pytest >=8.1.2
  - pytest-cov >=5.0.0
  - python >=3.11
  - requests >=2.31.0
  - ruff >=0.4.3
  - scipy >=1.13.0
  - selenium >=4.20.0
  - types-requests >=2.31.0.20240406
  - typing-extensions >=4.11.0
  - zeep >=4.2.1
source:
  path: ..
  use_gitignore: true
tests:
- python:
    imports:
    - parameteriser
