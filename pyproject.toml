[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61.0"]

[project]
authors = [
  {name = "Marvin van Aalst", email = "marvin.vanaalst@gmail.com"}
]
description = ""
name = "parameteriser"
version = "0.1.0"

[tool]

[tool.mypy]
ignore_missing_imports = true

[tool.pixi.dependencies]
beautifulsoup4 = ">=4.12.3"
jupyter = "*"
jupyter_contrib_nbextensions = ">=0.7.0"
matplotlib = ">=3.8.4"
notebook = ">=6.5.4"
numpy = ">=1.26.4"
pandas = ">=2.2.2"
pandas-stubs = ">=2.0.1.230501"
pytest = ">=8.1.2"
pytest-cov = ">=5.0.0"
python = ">=3.11"
requests = ">=2.31.0"
ruff = ">=0.4.3"
scipy = ">=1.13.0"
selenium = ">=4.20.0"
sspipe = ">=0.1.17"
types-requests = ">=2.31.0.20240406"
typing-extensions = ">=4.11.0"
zeep = ">=4.2.1"

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.system-requirements]
linux = "5.4.0"

[tool.pixi.tasks]
check = "ruff check ."
install = "pip install --editable ."
test = "pytest --cov"

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
indent-width = 4
line-length = 88

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
ignore = [
  "ANN101",
  "ANN401",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D205",
  "D211",
  "D213",
  "D400",
  "D403",
  "D415",
  "E501",
  "S101",
  "S301",
  "S110",
  "N806",
  "PGH003",
  "PLR0913",
  "FIX001",
  "TD001",
  "TD002",
  "TD003",
  "TRY003",
  "PD901",
  "RUF100"
]
select = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["T201"]
